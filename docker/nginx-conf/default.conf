server {
    listen 80 default_server;
    server_name _;

    # Web-Root zeigt auf public_html/ - config.php, src/ und data/ liegen
    # eine Ebene höher (/var/www/html/...) und sind damit vom Web aus NICHT
    # erreichbar, egal was in /var/www/html sonst noch liegt.
    root /var/www/html/public_html;
    index index.php;

    # etwas grösseres Limit für spätere Bild-/Video-Uploads (Phase 3)
    client_max_body_size 200m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Sicherheits-Reserve (defense in depth): greift zusätzlich zur oben
    # gesetzten root, falls WEBROOT/root jemals versehentlich auf
    # /var/www/html statt /var/www/html/public_html zeigt.
    location ~ ^/(config\.php|src/|data/) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
